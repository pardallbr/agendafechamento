<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Mensal de Aulas - Espaço EDM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1e293b;
      padding: 30px 24px;
    }
    .wrapper {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      margin: 24px 0 14px 0;
    }
    .btn-auth {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-auth:hover { background-color: #0369a1; }
    .filtros-topo {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .campo-inline {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 500;
    }
    input[type="date"], input[type="month"] {
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .btn-acao {
      align-self: flex-start;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-acao:hover { background-color: #0369a1; }
    .btn-gerar-final {
      background-color: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin: 20px 0;
    }
    .btn-gerar-final:hover { background-color: #15803d; }
    
    /* Tabelas */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th {
      background-color: #1e3a5f;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: left;
      padding: 10px 12px;
      border: 1px solid #1e3a5f;
    }
    td {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      font-size: 0.9rem;
      vertical-align: middle;
    }
    tr:nth-child(even) { background-color: #f8fafc; }
    .col-check { width: 50px; text-align: center; }
    .col-check input { width: 16px; height: 16px; cursor: pointer; }
    .col-sessao { width: 70px; text-align: center; font-weight: 600; }
    .col-valor { width: 130px; }
    .input-preco {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .tag-dias {
      color: #2563eb;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .total-geral {
      margin-top: 15px;
      text-align: right;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }
    .agenda-box {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 15px;
      max-width: 450px;
    }
    .agenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 0.85rem;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="wrapper">
    <h1>Relatório de Aulas - Espaço EDM</h1>

    <!-- Autenticação -->
    <div id="authSection" style="margin-bottom: 20px;">
      <button class="btn-auth" onclick="autenticarGoogle()">Conectar Google Agenda</button>
    </div>

    <!-- Etapa 1: Filtros de Período e Agendas -->
    <div id="appControls" style="display: none;">
      <div class="filtros-topo">
        <div>
          <label style="font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 4px;">Escolha as agendas:</label>
          <div id="listaAgendas" class="agenda-box">Carregando agendas...</div>
        </div>

        <div class="campo-inline">
          <label for="filtroDataAte">Contar sessões até o dia:</label>
          <input type="date" id="filtroDataAte">
        </div>

        <button class="btn-acao" id="btnBuscar" onclick="buscarSessoesDaAgenda()">Buscar crianças da agenda</button>
      </div>

      <!-- Etapa 2: Tabela de seleção de crianças e edição de valores -->
      <div id="secaoConfiguracao" style="display: none;">
        <h2>2. Desmarque o que não é criança e coloque o valor da sessão</h2>
        <table>
          <thead>
            <tr>
              <th class="col-check">Incluir</th>
              <th>Nome no evento</th>
              <th style="width: 140px;">Dias no mês</th>
              <th class="col-sessao">Sessões</th>
              <th class="col-valor">Valor (R$)</th>
            </tr>
          </thead>
          <tbody id="corpoTabelaConfig"></tbody>
        </table>

        <button class="btn-gerar-final" onclick="gerarRelatorioFinal()">Gerar Relatório Consolidado</button>
      </div>

      <!-- Etapa 3: Relatório Final -->
      <div id="secaoRelatorioFinal" style="display: none;">
        <h2 id="tituloRelatorioFinal">Relatório de Sessões</h2>
        <table>
          <thead>
            <tr>
              <th>Criança</th>
              <th>Dias</th>
              <th class="col-sessao">Sessões</th>
              <th>Valor da sessão</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="corpoTabelaFinal"></tbody>
        </table>
        <div class="total-geral" id="txtTotalGeral"></div>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = '846101014697-0nrq60gv7sgelmgtslncq3a0cds0osff.apps.googleusercontent.com';
    const CHAVE_STORAGE = 'edm_valores_criancas';

    let tokenClient;
    let tokenAcesso = null;
    let mapaAlunos = {};

    window.onload = () => {
      // Define a data atual no filtro
      const hoje = new Date();
      document.getElementById('filtroDataAte').value = hoje.toISOString().split('T')[0];

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/calendar.readonly',
        callback: (resp) => {
          if (resp.error) return alert('Falha ao autenticar.');
          tokenAcesso = resp.access_token;
          document.getElementById('authSection').style.display = 'none';
          document.getElementById('appControls').style.display = 'block';
          carregarAgendas();
        }
      });
    };

    function autenticarGoogle() {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    async function apiRequest(url) {
      const resp = await fetch(url, {
        headers: { Authorization: `Bearer ${tokenAcesso}` }
      });
      return await resp.json();
    }

    // Carrega agendas da conta
    async function carregarAgendas() {
      const container = document.getElementById('listaAgendas');
      try {
        const data = await apiRequest('https://www.googleapis.com/calendar/v3/users/me/calendarList');
        container.innerHTML = '';
        if (!data.items || data.items.length === 0) {
          container.innerHTML = 'Nenhuma agenda encontrada.';
          return;
        }
        data.items.forEach(cal => {
          const div = document.createElement('div');
          div.className = 'agenda-item';
          div.innerHTML = `
            <input type="checkbox" id="cal_${cal.id}" value="${cal.id}" checked>
            <label for="cal_${cal.id}" style="cursor:pointer;">${cal.summary}</label>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        container.innerHTML = 'Erro ao carregar agendas.';
      }
    }

    // Memória Local de Valores
    function obterValoresSalvos() {
      try {
        return JSON.parse(localStorage.getItem(CHAVE_STORAGE)) || {};
      } catch (e) {
        return {};
      }
    }

    function salvarValorNoStorage(nome, valor) {
      const salvos = obterValoresSalvos();
      salvos[nome.trim()] = valor;
      localStorage.setItem(CHAVE_STORAGE, JSON.stringify(salvos));
    }

    // Busca e agrupamento dos eventos por criança
    async function buscarSessoesDaAgenda() {
      const dataAteStr = document.getElementById('filtroDataAte').value;
      if (!dataAteStr) return alert('Selecione a data limite.');

      const checkboxes = document.querySelectorAll('#listaAgendas input[type="checkbox"]:checked');
      if (checkboxes.length === 0) return alert('Selecione pelo menos uma agenda.');

      const [ano, mes, dia] = dataAteStr.split('-').map(Number);
      const timeMin = new Date(ano, mes - 1, 1, 0, 0, 0).toISOString();
      const timeMax = new Date(ano, mes - 1, dia, 23, 59, 59).toISOString();

      const btn = document.getElementById('btnBuscar');
      btn.disabled = true;
      btn.innerText = 'Carregando agenda...';

      let todosEventos = [];
      for (const cb of checkboxes) {
        const idCal = encodeURIComponent(cb.value);
        const url = `https://www.googleapis.com/calendar/v3/calendars/${idCal}/events?timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`;
        const res = await apiRequest(url);
        if (res.items) todosEventos = todosEventos.concat(res.items);
      }

      btn.disabled = false;
      btn.innerText = 'Buscar crianças da agenda';

      // Agrupar por nome do evento e coletar dias
      mapaAlunos = {};
      todosEventos.forEach(ev => {
        const nome = (ev.summary || '').trim();
        if (!nome) return;

        const inicio = ev.start?.dateTime || ev.start?.date;
        if (!inicio) return;

        const diaNum = String(new Date(inicio).getDate()).padStart(2, '0');

        if (!mapaAlunos[nome]) {
          mapaAlunos[nome] = { sessoes: 0, dias: new Set() };
        }
        mapaAlunos[nome].sessoes += 1;
        mapaAlunos[nome].dias.add(diaNum);
      });

      renderizarTabelaConfiguracao();
    }

    function renderizarTabelaConfiguracao() {
      const tbody = document.getElementById('corpoTabelaConfig');
      tbody.innerHTML = '';

      const valoresSalvos = obterValoresSalvos();
      const nomes = Object.keys(mapaAlunos).sort((a, b) => a.localeCompare(b));

      nomes.forEach((nome, idx) => {
        const item = mapaAlunos[nome];
        const diasFormatados = Array.from(item.dias).sort((a, b) => Number(a) - Number(b)).join(', ');
        const valorSalvo = valoresSalvos[nome] !== undefined ? valoresSalvos[nome] : '';

        // Filtro prévio: desmarca eventos que parecem compromissos/aniversários
        const provavelCrianca = !nome.toLowerCase().includes('aniversário') && !nome.toLowerCase().includes('aniversario');

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="col-check">
            <input type="checkbox" id="chk_${idx}" data-nome="${nome}" ${provavelCrianca ? 'checked' : ''}>
          </td>
          <td><strong>${nome}</strong></td>
          <td class="tag-dias">${diasFormatados}</td>
          <td class="col-sessao">${item.sessoes}</td>
          <td class="col-valor">
            <input type="number" class="input-preco" id="val_${idx}" data-nome="${nome}" value="${valorSalvo}" placeholder="0" step="5" onchange="salvarValorNoStorage('${nome}', this.value)">
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('secaoConfiguracao').style.display = 'block';
      document.getElementById('secaoRelatorioFinal').style.display = 'none';
    }

    function gerarRelatorioFinal() {
      const tbody = document.getElementById('corpoTabelaFinal');
      tbody.innerHTML = '';

      const rows = document.querySelectorAll('#corpoTabelaConfig tr');
      let totalGeral = 0;
      let totalAulasGeral = 0;

      rows.forEach(tr => {
        const chk = tr.querySelector('input[type="checkbox"]');
        if (!chk || !chk.checked) return;

        const nome = chk.getAttribute('data-nome');
        const inputVal = tr.querySelector('.input-preco');
        const valorUnitario = parseFloat(inputVal.value) || 0;

        const item = mapaAlunos[nome];
        const subtotal = item.sessoes * valorUnitario;
        totalGeral += subtotal;
        totalAulasGeral += item.sessoes;

        const diasFormatados = Array.from(item.dias).sort((a, b) => Number(a) - Number(b)).join(', ');

        const trFinal = document.createElement('tr');
        trFinal.innerHTML = `
          <td><strong>${nome}</strong></td>
          <td class="tag-dias">${diasFormatados}</td>
          <td class="col-sessao">${item.sessoes}</td>
          <td>${valorUnitario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
          <td><strong>${subtotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></td>
        `;
        tbody.appendChild(trFinal);
      });

      const dataAte = document.getElementById('filtroDataAte').value;
      const partes = dataAte.split('-');
      const dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
      
      document.getElementById('tituloRelatorioFinal').innerText = `Relatório de Sessões (até ${dataFormatada})`;
      document.getElementById('txtTotalGeral').innerText = `Total: ${totalAulasGeral} sessões | ${totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}`;

      document.getElementById('secaoRelatorioFinal').style.display = 'block';
      document.getElementById('secaoRelatorioFinal').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
